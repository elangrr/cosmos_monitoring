# Prometheus config for cosmos_monitoring.
# Replace every <PLACEHOLDER> with the values of YOUR server. Nothing here works until you do.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]   # change if you set ALERTMANAGER_PORT in .env

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # CometBFT metrics of your Cosmos SDK nodes.
  # Each node needs `prometheus = true` in config.toml ([instrumentation]); the port is
  # `prometheus_listen_addr` there (default 26660). One entry per node.
  - job_name: "cosmos"
    static_configs:
      - targets: ["<NODE_1_HOST>:<NODE_1_METRICS_PORT>"]   # e.g. 127.0.0.1:26660
        labels:
          node: "<NODE_1_NAME>"                           # any name you like, e.g. cosmoshub
      # - targets: ["<NODE_2_HOST>:<NODE_2_METRICS_PORT>"]
      #   labels:
      #     node: "<NODE_2_NAME>"

  # Server stats (CPU, RAM, disk) from the bundled node-exporter.
  - job_name: "node"
    static_configs:
      - targets: ["127.0.0.1:9100"]                       # change if you set NODE_EXPORTER_PORT
        labels:
          node: "<SERVER_NAME>"
