# cosmos_monitoring: Prometheus + Grafana + Alertmanager for Cosmos SDK validators.
# Every service binds to 127.0.0.1 only. Open Grafana through an SSH tunnel (see README).
# host networking lets Prometheus reach node metrics ports on the same server.
services:
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: cm-prometheus
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.listen-address=127.0.0.1:${PROMETHEUS_PORT:-9090}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: cm-alertmanager
    network_mode: host
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:${ALERTMANAGER_PORT:-9093}
      - --cluster.listen-address=
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/telegram_bot_token:/etc/alertmanager/telegram_bot_token:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: cm-node-exporter
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:${NODE_EXPORTER_PORT:-9100}
      - --collector.textfile.directory=/host/var/lib/node_exporter/textfile
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    container_name: cm-grafana
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-3000}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      PROMETHEUS_URL: http://127.0.0.1:${PROMETHEUS_PORT:-9090}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
